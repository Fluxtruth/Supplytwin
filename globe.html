<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Supply Chain Globe — Supply Chain Twin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#080c16; --bg2:#0d1220; --border:rgba(255,255,255,.07);
      --text:#e0e4f0; --muted:#5a6380; --muted2:#8490b8;
    }
    html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Segoe UI',system-ui,sans-serif; color:var(--text); }

    #globe-canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }

    /* ── Nav ── */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:100;
      display:flex; align-items:center; gap:.65rem; padding:.5rem 1.1rem;
      background:rgba(8,12,22,.88); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }
    .logo-icon {
      width:26px; height:26px; border-radius:6px;
      background:linear-gradient(135deg,#4f8ef7,#a855f7);
      display:flex; align-items:center; justify-content:center;
      font-size:.65rem; font-weight:900; color:#fff; flex-shrink:0;
    }
    .nav-title { font-size:.84rem; font-weight:700; letter-spacing:.02em; flex:1; }
    .nav-link {
      font-size:.7rem; color:var(--muted2); text-decoration:none; padding:.18rem .48rem;
      border-radius:4px; border:1px solid transparent;
    }
    .nav-link:hover { border-color:var(--border); color:var(--text); }
    .api-badge {
      display:flex; align-items:center; gap:.32rem; font-size:.63rem; padding:.18rem .5rem;
      border-radius:4px; background:rgba(255,255,255,.04); border:1px solid var(--border); color:var(--muted2);
    }
    .api-badge .dot { width:5px; height:5px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    .api-badge.live .dot { background:#22c55e; box-shadow:0 0 5px #22c55e; }
    .api-badge.live { color:#4ade80; border-color:rgba(34,197,94,.25); }
    .event-ticker { overflow:hidden; max-height:50px; width:170px; display:none; flex-direction:column; }
    .api-badge.live ~ .event-ticker { display:flex; }
    .ticker-item { font-size:.57rem; color:var(--muted2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:.03rem 0; animation:tickin .3s ease; }
    .ticker-item.crit { color:#f87171; } .ticker-item.warn { color:#fbbf24; } .ticker-item.ok { color:#4ade80; }
    @keyframes tickin { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }

    /* ── Info Panel ── */
    #globe-panel {
      position:fixed; top:0; right:-340px; bottom:0; width:318px; z-index:90;
      background:rgba(9,13,24,.96); backdrop-filter:blur(18px);
      border-left:1px solid var(--border);
      padding:4rem 1.15rem 1.15rem;
      transition:right .32s cubic-bezier(.4,0,.2,1);
      overflow-y:auto;
    }
    #globe-panel.open { right:0; }
    .panel-close {
      position:absolute; top:.65rem; right:.65rem;
      background:rgba(255,255,255,.06); border:1px solid var(--border);
      border-radius:5px; color:var(--muted2); cursor:pointer; padding:.18rem .48rem; font-size:.72rem; font-family:inherit;
    }
    .panel-phase-icon { font-size:2.2rem; margin-bottom:.5rem; }
    .panel-phase-id { font-size:.58rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-bottom:.2rem; }
    .panel-phase-name { font-size:1.05rem; font-weight:800; margin-bottom:.4rem; }
    .panel-location { font-size:.7rem; color:var(--muted2); margin-bottom:.7rem; }
    .risk-badge {
      display:inline-flex; align-items:center; gap:.28rem; padding:.22rem .55rem;
      border-radius:999px; font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:.9rem;
    }
    .risk-badge::before { content:'●'; font-size:.42rem; }
    .risk-badge.critical { background:rgba(220,38,38,.15); color:#f87171; border:1px solid rgba(220,38,38,.3); }
    .risk-badge.high     { background:rgba(234,88,12,.15);  color:#fb923c; border:1px solid rgba(234,88,12,.3); }
    .risk-badge.medium   { background:rgba(202,138,4,.15);  color:#fbbf24; border:1px solid rgba(202,138,4,.3); }
    .risk-badge.low      { background:rgba(22,163,74,.15);  color:#4ade80; border:1px solid rgba(22,163,74,.3); }
    .panel-sec-lbl { font-size:.58rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.38rem; margin-top:.7rem; }
    .panel-flow-row { display:flex; align-items:center; gap:.38rem; font-size:.7rem; margin-bottom:.28rem; color:var(--muted2); }
    .panel-flow-row b { color:var(--text); }
    .panel-company {
      display:flex; align-items:center; gap:.42rem; font-size:.7rem;
      padding:.22rem 0; border-bottom:1px solid rgba(255,255,255,.04);
    }
    .panel-co-flag { font-size:.82rem; }
    .panel-co-name { flex:1; }
    .panel-co-share { color:var(--muted); font-size:.62rem; }
    .panel-health-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .panel-desc { font-size:.68rem; color:var(--muted2); line-height:1.55; margin-top:.5rem; padding:.5rem .6rem; background:rgba(255,255,255,.03); border-radius:5px; border:1px solid var(--border); }
    .panel-detail-btn {
      display:block; width:100%; margin-top:1.1rem; padding:.52rem;
      background:linear-gradient(135deg,#4f8ef7,#a855f7); border:none;
      border-radius:8px; color:#fff; font-size:.8rem; font-weight:600;
      cursor:pointer; font-family:inherit; text-align:center; text-decoration:none;
    }
    .panel-detail-btn:hover { opacity:.88; }

    /* ── Legend ── */
    #globe-legend {
      position:fixed; bottom:1.1rem; left:1.1rem; z-index:80;
      background:rgba(8,12,22,.84); backdrop-filter:blur(10px);
      border:1px solid var(--border); border-radius:8px; padding:.6rem .8rem;
      max-height:calc(100vh - 6rem); overflow-y:auto;
    }
    .legend-title { font-size:.56rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.3rem; }
    .legend-item {
      display:flex; align-items:center; gap:.4rem; font-size:.63rem; color:var(--muted2);
      cursor:pointer; padding:.12rem .1rem; border-radius:3px; transition:color .13s;
    }
    .legend-item:hover { color:var(--text); }
    .legend-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

    /* ── Controls ── */
    #globe-controls {
      position:fixed; top:3.4rem; right:1rem; z-index:80;
      display:flex; flex-direction:column; gap:.3rem;
    }
    .ctrl-btn {
      display:flex; align-items:center; gap:.32rem;
      background:rgba(8,12,22,.84); backdrop-filter:blur(8px);
      border:1px solid var(--border); border-radius:6px;
      padding:.25rem .55rem; font-size:.62rem; color:var(--muted2);
      cursor:pointer; font-family:inherit; transition:all .13s; white-space:nowrap;
    }
    .ctrl-btn.active  { border-color:rgba(79,142,247,.4); color:#7eb3ff; background:rgba(79,142,247,.08); }
    .ctrl-btn:hover   { border-color:rgba(255,255,255,.15); color:var(--text); }

    /* ── Tooltip ── */
    #globe-tooltip {
      position:fixed; z-index:200; pointer-events:none;
      background:rgba(9,13,24,.93); border:1px solid var(--border);
      border-radius:6px; padding:.38rem .62rem; font-size:.68rem;
      display:none; transform:translate(14px,-50%);
    }
    #globe-tooltip.vis { display:block; }
    .tt-name { font-weight:700; margin-bottom:.12rem; }
    .tt-risk { font-size:.6rem; color:var(--muted2); }

    /* ── Loading ── */
    #globe-loading {
      position:fixed; inset:0; z-index:500; background:var(--bg);
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:.75rem;
    }
    .loading-spinner {
      width:34px; height:34px; border-radius:50%;
      border:2px solid var(--border); border-top-color:#4f8ef7;
      animation:spin 1s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg) } }
    .loading-text { font-size:.75rem; color:var(--muted2); }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
    }
  }
  </script>
</head>

<canvas id="globe-canvas"></canvas>

<!-- Info Panel -->
<div id="globe-panel">

  <div class="panel-phase-name" id="panel-name"></div>

<!-- Legend -->

<!-- Layer Controls -->
<div id="globe-controls">

</div>

<!-- Hover tooltip -->
<div id="globe-tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-risk" id="tt-risk"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Phase + Edge Data ────────────────────────────────────────────────────────

const GLOBE_PHASES = [
  { id:'01', icon:'⛏️',  name:'HPQ Sand Mining',       shortName:'HPQ Sand',   color:'#b45309', risk:4.2, riskCls:'medium',   location:'Spruce Pine, NC, USA',               lat: 35.92, lng: -82.06,
    description:'Reinheitsgrad 99,9995% SiO₂ — Monopol Spruce Pine. TQC + Sibelco kontrollieren >90% des globalen HPQ-Markts.',
    companies:[{name:'The Quartz Corp',flag:'🇺🇸',share:'~50%',health:'ok'},{name:'Sibelco',flag:'🇧🇪',share:'~40%',health:'ok'},{name:'Min. Santa Rosa',flag:'🇧🇷',share:'~5%',health:'ok'}] },

  { id:'02', icon:'🔥',  name:'Si-Metall-Verhüttung',  shortName:'Si-Metall',  color:'#c2410c', risk:5.8, riskCls:'medium',   location:'Norwegen, Spanien, Deutschland, CN',  lat: 53.54, lng:   9.99,
    description:'Lichtbogenofen 1.800°C, 13 kWh/kg. Hoshine auf UFLPA Entity List (Xinjiang).',
    companies:[{name:'Ferroglobe',flag:'🇪🇸',share:'~18%',health:'ok'},{name:'Elkem',flag:'🇳🇴',share:'~16%',health:'ok'},{name:'Hoshine Silicon',flag:'🇨🇳',share:'~15%',health:'crit'}] },

  { id:'03', icon:'🧪',  name:'Polysilizium',           shortName:'Poly-Si',    color:'#d97706', risk:7.1, riskCls:'high',     location:'China 62%, Deutschland 11%, USA 9%',  lat: 48.16, lng:  12.83,
    description:'Siemens-Prozess CVD-Reaktor, 9N Reinheit. Spot-Preis $8.20/kg. Überkapazität CN drückt Margen.',
    companies:[{name:'GCL-Poly Energy',flag:'🇨🇳',share:'~27%',health:'warn'},{name:'Tongwei',flag:'🇨🇳',share:'~21%',health:'ok'},{name:'Wacker Chemie',flag:'🇩🇪',share:'~11%',health:'warn'}] },

  { id:'04', icon:'💿',  name:'Si-Wafer',               shortName:'Si-Wafer',   color:'#2563eb', risk:6.2, riskCls:'high',     location:'Japan 55%, Taiwan 17%, USA/DE/SG 13%',lat: 24.78, lng: 120.99,
    description:'300mm Czochralski-Kristall. 12–16 Wo. Lieferzeit. GlobalWafers Sherman TX Ramp unter Plan.',
    companies:[{name:'Shin-Etsu Chemical',flag:'🇯🇵',share:'~30%',health:'ok'},{name:'SUMCO Corporation',flag:'🇯🇵',share:'~25%',health:'ok'},{name:'GlobalWafers',flag:'🇹🇼',share:'~17%',health:'warn'}] },

  { id:'05', icon:'🔬',  name:'EUV-Lithographie',       shortName:'EUV-Litho',  color:'#dc2626', risk:9.1, riskCls:'critical', location:'Veldhoven NL (ASML) · Santa Clara CA', lat: 51.42, lng:   5.45,
    description:'ASML-Weltmonopol EUV. High-NA NXE:5000 ab 2024. CN-Export gesperrt. 18 Monate Lieferzeit.',
    companies:[{name:'ASML Holding',flag:'🇳🇱',share:'100% EUV',health:'warn'},{name:'Applied Materials',flag:'🇺🇸',share:'CVD/PVD',health:'ok'},{name:'KLA Corporation',flag:'🇺🇸',share:'Inspection',health:'ok'}] },

  { id:'06', icon:'🏭',  name:'Halbleiter-Foundry',     shortName:'Foundry',    color:'#7c3aed', risk:8.8, riskCls:'critical', location:'Taiwan 58%, Korea 13%, USA 14%',       lat: 23.02, lng: 120.24,
    description:'TSMC N3/N2 Prozessknoten. Geopolitisches Taiwan-Risiko 8.8/10. CHIPS Act Fabs im Aufbau.',
    companies:[{name:'TSMC',flag:'🇹🇼',share:'~58%',health:'warn'},{name:'Samsung Foundry',flag:'🇰🇷',share:'~17%',health:'ok'},{name:'GlobalFoundries',flag:'🇺🇸',share:'~7%',health:'ok'}] },

  { id:'07', icon:'🧠',  name:'KI-Chip-Design',         shortName:'GPU Design', color:'#6d28d9', risk:7.4, riskCls:'high',     location:'Santa Clara CA · Mountain View CA',    lat: 37.47, lng:-121.97,
    description:'NVIDIA H100/B200. BIS Export-Kontrolle sperrt H100/H20 nach China. CoWoS-Verpackung limitiert.',
    companies:[{name:'NVIDIA',flag:'🇺🇸',share:'80%+ AI-GPU',health:'ok'},{name:'AMD',flag:'🇺🇸',share:'MI300X',health:'ok'},{name:'Intel',flag:'🇺🇸',share:'Gaudi 3',health:'warn'}] },

  { id:'08', icon:'🖥️',  name:'Server-Integration',    shortName:'Server',     color:'#0891b2', risk:5.4, riskCls:'medium',   location:'San Jose CA · Round Rock TX',          lat: 37.20, lng:-121.88,
    description:'HGX B200-Systeme. HBM3e-Engpass bei SK Hynix. 12 Wo. Rack-Assembly-Rückstand.',
    companies:[{name:'Supermicro',flag:'🇺🇸',share:'~25%',health:'ok'},{name:'Dell Technologies',flag:'🇺🇸',share:'~20%',health:'ok'},{name:'HPE',flag:'🇺🇸',share:'~15%',health:'ok'}] },

  { id:'09', icon:'🏗️',  name:'Hyperscale-Datacenter',  shortName:'DC / Cloud', color:'#0d9488', risk:4.8, riskCls:'medium',   location:'Ashburn VA · Boydton VA · The Dalles OR',lat:39.04, lng: -77.49,
    description:'AWS/Azure/GCP H100-Kapazität 95–100% ausgelastet. Ashburn = weltgrößter Data-Center-Cluster.',
    companies:[{name:'Amazon AWS',flag:'🇺🇸',share:'31%',health:'ok'},{name:'Microsoft Azure',flag:'🇺🇸',share:'25%',health:'ok'},{name:'Google Cloud',flag:'🇺🇸',share:'11%',health:'ok'}] },

  { id:'10', icon:'⚡',  name:'Energieinfrastruktur',   shortName:'Energie',    color:'#16a34a', risk:6.0, riskCls:'high',     location:'USA national — Wind, Solar, Nuklear',  lat: 32.51, lng:-100.41,
    description:'380 GWh/d KI-DC-Bedarf, +40%/Jahr. Nuklear-Renaissance: Constellation Starlights-Programm.',
    companies:[{name:'NextEra Energy',flag:'🇺🇸',share:'Wind/Solar',health:'ok'},{name:'Constellation Energy',flag:'🇺🇸',share:'Nuklear',health:'ok'},{name:'Duke Energy',flag:'🇺🇸',share:'Grid',health:'ok'}] },
];

const GLOBE_EDGES = [
  { from:'01', to:'02', material:'HPQ-Quarz',         transport:'🚛 LKW / 🚂 Rail',    vol:'490 t/d',       color:0xb45309 },
  { from:'02', to:'03', material:'Si-Metall',          transport:'🚢 Container',         vol:'1.200 t/d',     color:0xc2410c },
  { from:'03', to:'04', material:'Polysilizium',        transport:'✈️ Luft / 🚢 See',    vol:'300 t/d',       color:0xd97706 },
  { from:'04', to:'05', material:'Wafer & Equipment',  transport:'✈️ Luft / 🚚 LKW',    vol:'2,2M Wafer/d',  color:0x2563eb },
  { from:'05', to:'06', material:'EUV-Anlagen',         transport:'✈️ Heavy-Lift Air',   vol:'~1 EUV/d',      color:0xdc2626 },
  { from:'06', to:'07', material:'Chips',               transport:'✈️ Air Express',      vol:'22M Chips/d',   color:0x7c3aed },
  { from:'07', to:'08', material:'GPUs',                transport:'✈️ Luft / 🚛 LKW',   vol:'40k GPUs/d',    color:0x6d28d9 },
  { from:'08', to:'09', material:'Server',              transport:'🚛 LKW / ✈️ Charter', vol:'400 Server/d',  color:0x0891b2 },
  { from:'10', to:'09', material:'Strom',               transport:'⚡ Grid',             vol:'380 GWh/d',     color:0x16a34a },
];

// ─── Three.js Scene ───────────────────────────────────────────────────────────

const W = () => window.innerWidth, H = () => window.innerHeight;

const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(45, W()/H(), 0.05, 100);
camera.position.set(0, 0.6, 2.8);

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('globe-canvas'),
  antialias: true,
  alpha: false,
});
renderer.setSize(W(), H());
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x080c16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping    = true;
controls.dampingFactor    = 0.08;
controls.autoRotate       = true;
controls.autoRotateSpeed  = 0.38;
controls.minDistance      = 1.42;
controls.maxDistance      = 4.8;
controls.enablePan        = false;
controls.target.set(0, 0, 0);

let ctrlRotateActive = true;
let autoRotatePauseTimer = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(autoRotatePauseTimer);
});
controls.addEventListener('end', () => {
  autoRotatePauseTimer = setTimeout(() => {
    if (ctrlRotateActive) controls.autoRotate = true;
  }, 4000);
});

// ─── Lighting ─────────────────────────────────────────────────────────────────

scene.add(new THREE.AmbientLight(0x4466aa, 0.65));
const dirLight = new THREE.DirectionalLight(0x8899cc, 1.3);
dirLight.position.set(3, 4, 2);
scene.add(dirLight);

// ─── Stars ────────────────────────────────────────────────────────────────────

const starPositions = [];
for (let i = 0; i < 2800; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const r     = 40 + Math.random() * 18;
  starPositions.push(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.07, sizeAttenuation:true, transparent:true, opacity:0.65 })));

// ─── Globe Sphere ─────────────────────────────────────────────────────────────

const globeMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshPhongMaterial({ color:0x0d1628, shininess:14, specular:0x223355 })
);
scene.add(globeMesh);

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.001, 36, 18),
  new THREE.MeshBasicMaterial({ wireframe:true, color:0x1e3a5f, transparent:true, opacity:0.19 })
));

scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.09, 32, 32),
  new THREE.MeshBasicMaterial({ color:0x4f8ef7, transparent:true, opacity:0.05, side:THREE.BackSide })
));

// ─── Lat/Lng → Vec3 ───────────────────────────────────────────────────────────

function latLngToVec3(lat, lng, r = 1) {
  const phi   = (90 - lat) * (Math.PI / 180);
  const theta = (lng + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// ─── Phase Nodes ──────────────────────────────────────────────────────────────

const nodeMeshes  = [];
const glowMeshes  = [];
const pulseMeshes = [];
const pulseStates = [];
const billboards  = [];

GLOBE_PHASES.forEach((phase, i) => {
  const pos = latLngToVec3(phase.lat, phase.lng, 1.022);
  const col = new THREE.Color(phase.color);

  // Core node
  const node = new THREE.Mesh(
    new THREE.SphereGeometry(0.028, 16, 16),
    new THREE.MeshBasicMaterial({ color: col })
  );
  node.position.copy(pos);
  node.userData = { phaseId: phase.id, phaseIdx: i };
  scene.add(node);
  nodeMeshes.push(node);

  // Glow halo (billboard)
  const glow = new THREE.Mesh(
    new THREE.RingGeometry(0.034, 0.062, 32),
    new THREE.MeshBasicMaterial({ color: col, transparent:true, opacity:0.5, side:THREE.DoubleSide })
  );
  glow.position.copy(pos);
  scene.add(glow);
  glowMeshes.push(glow);
  billboards.push({ mesh:glow });

  // Pulse ring (risk >= 7 only)
  if (phase.risk >= 7) {
    const pulse = new THREE.Mesh(
      new THREE.RingGeometry(0.03, 0.055, 32),
      new THREE.MeshBasicMaterial({ color: col, transparent:true, opacity:0, side:THREE.DoubleSide })
    );
    pulse.position.copy(pos);
    scene.add(pulse);
    pulseMeshes.push(pulse);
    pulseStates.push({ t: Math.random(), phaseIdx: i });
    billboards.push({ mesh:pulse });
  }
});

// ─── Arc Flows ────────────────────────────────────────────────────────────────

const arcGroups    = [];
const arcParticles = [];
const allCurves    = [];

GLOBE_EDGES.forEach(edge => {
  const fp = GLOBE_PHASES.find(p => p.id === edge.from);
  const tp = GLOBE_PHASES.find(p => p.id === edge.to);
  if (!fp || !tp) return;

  const a   = latLngToVec3(fp.lat, fp.lng, 1.02);
  const b   = latLngToVec3(tp.lat, tp.lng, 1.02);
  // Arc apex: mid-point lifted above sphere surface
  const apex = a.clone().add(b).normalize().multiplyScalar(1.45);
  const curve = new THREE.QuadraticBezierCurve3(a, apex, b);
  allCurves.push(curve);

  const pts  = curve.getPoints(90);
  const geo  = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo,
    new THREE.LineBasicMaterial({ color: edge.color, transparent:true, opacity:0.48 })
  );
  scene.add(line);
  arcGroups.push(line);

  // 2 particles per arc, staggered start
  for (let k = 0; k < 2; k++) {
    const pMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.011, 8, 8),
      new THREE.MeshBasicMaterial({ color: edge.color })
    );
    const t0 = k * 0.5;
    pMesh.position.copy(curve.getPoint(t0));
    scene.add(pMesh);
    arcParticles.push({ mesh:pMesh, curve, t:t0, speed:0.0013 + Math.random()*0.0007 });
  }
});

// ─── Raycasting ───────────────────────────────────────────────────────────────

const raycaster = new THREE.Raycaster();
const mouse2    = new THREE.Vector2();
let hoveredIdx  = -1;
let selectedIdx = -1;

function getNodeHit(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse2.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse2.y = -((event.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse2, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  return hits.length > 0 ? hits[0].object : null;
}

renderer.domElement.addEventListener('mousemove', e => {
  const hit = getNodeHit(e);
  const tt  = document.getElementById('globe-tooltip');
  if (hit) {
    const idx   = hit.userData.phaseIdx;
    const phase = GLOBE_PHASES[idx];
    hoveredIdx  = idx;
    renderer.domElement.style.cursor = 'pointer';
    document.getElementById('tt-name').textContent = `${phase.icon} ${phase.name}`;
    document.getElementById('tt-risk').textContent =
      `Risiko ${phase.risk}/10 · ${phase.riskCls.toUpperCase()} · ${phase.location}`;
    tt.style.left = `${e.clientX}px`;
    tt.style.top  = `${e.clientY}px`;
    tt.classList.add('vis');
  } else {
    hoveredIdx = -1;
    renderer.domElement.style.cursor = 'default';
    tt.classList.remove('vis');
  }
});

renderer.domElement.addEventListener('click', e => {
  const hit = getNodeHit(e);
  if (hit) openPanel(hit.userData.phaseIdx);
  else closePanel();
});

// ─── Info Panel ───────────────────────────────────────────────────────────────

function openPanel(idx) {
  selectedIdx = idx;
  const p = GLOBE_PHASES[idx];

  document.getElementById('panel-icon').textContent     = p.icon;
  document.getElementById('panel-id').textContent       = `PHASE ${p.id} VON 10`;
  document.getElementById('panel-name').textContent     = p.name;
  document.getElementById('panel-location').textContent = `📍 ${p.location}`;
  document.getElementById('panel-desc').textContent     = p.description;

  const label = { critical:'KRITISCH', high:'HOCH', medium:'MITTEL', low:'NIEDRIG' }[p.riskCls] || p.riskCls.toUpperCase();
  document.getElementById('panel-risk').innerHTML =
    `<span class="risk-badge ${p.riskCls}">${p.risk}/10 · ${label}</span>`;

  // Flows
  const inc = GLOBE_EDGES.filter(e => e.to   === p.id);
  const out = GLOBE_EDGES.filter(e => e.from === p.id);
  let flowHtml = '';
  inc.forEach(e => {
    flowHtml += `<div class="panel-flow-row">⬇️ <b>${e.material}</b> von Phase ${e.from}
      <span style="color:var(--muted);margin-left:auto">${e.vol}</span></div>`;
  });
  out.forEach(e => {
    flowHtml += `<div class="panel-flow-row">⬆️ <b>${e.material}</b> → Phase ${e.to}
      <span style="color:var(--muted);margin-left:auto">${e.vol}</span></div>`;
  });
  document.getElementById('panel-flows').innerHTML = flowHtml;

  // Companies
  document.getElementById('panel-companies').innerHTML = p.companies.map(co => {
    const dot = co.health === 'ok' ? '#22c55e' : co.health === 'warn' ? '#f59e0b' : '#ef4444';
    return `<div class="panel-company">
      <span class="panel-co-flag">${co.flag}</span>
      <span class="panel-co-name">${co.name}</span>
      <span class="panel-co-share">${co.share}</span>
      <div class="panel-health-dot" style="background:${dot}"></div>
    </div>`;
  }).join('');

  document.getElementById('panel-detail-btn').href = `detail.html?phase=${p.id}`;
  document.getElementById('globe-panel').classList.add('open');
}

function closePanel() {
  selectedIdx = -1;
  document.getElementById('globe-panel').classList.remove('open');
}

document.getElementById('panel-close').addEventListener('click', closePanel);

// ─── Legend ───────────────────────────────────────────────────────────────────

const legendItems = document.getElementById('legend-items');
GLOBE_PHASES.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'legend-item';
  div.innerHTML = `<div class="legend-dot" style="background:${p.color}"></div>${p.icon} ${p.shortName}`;
  div.addEventListener('click', () => {
    openPanel(i);
    controls.autoRotate = false;
    // Smoothly tilt camera toward the clicked node
    const target = latLngToVec3(p.lat, p.lng, 2.6);
    camera.position.lerp(target, 0.55);
  });
  legendItems.appendChild(div);
});

// ─── Layer Controls ───────────────────────────────────────────────────────────

let ctrlArcsActive  = true;
let ctrlNodesActive = true;
let ctrlPulseActive = true;

document.querySelectorAll('.ctrl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.target;
    btn.classList.toggle('active');
    const on = btn.classList.contains('active');
    if (target === 'arcs') {
      ctrlArcsActive = on;
      arcGroups.forEach(l => l.visible = on);
      arcParticles.forEach(p => p.mesh.visible = on);
    }
    if (target === 'nodes') {
      ctrlNodesActive = on;
      nodeMeshes.forEach(n => n.visible = on);
      glowMeshes.forEach(g => g.visible = on);
    }
    if (target === 'pulse') {
      ctrlPulseActive = on;
      pulseMeshes.forEach(pm => pm.visible = on);
    }
    if (target === 'rotate') {
      ctrlRotateActive = on;
      controls.autoRotate = on;
    }
  });
});

// ─── API / SSE ────────────────────────────────────────────────────────────────

const API_BASE = 'http://localhost:3001/api/v1';

async function initFromAPI() {
  try {
    const res  = await fetch(`${API_BASE}/graph?companies=true`, { signal: AbortSignal.timeout(3000) });
    if (!res.ok) return false;
    const json = await res.json();
    if (!json.ok) return false;
    json.data.nodes.forEach(apiPhase => {
      const idx = GLOBE_PHASES.findIndex(p => p.id === apiPhase.id);
      if (idx < 0 || !apiPhase.risk) return;
      GLOBE_PHASES[idx].risk = apiPhase.risk.score ?? GLOBE_PHASES[idx].risk;
      // Glow opacity scales with risk
      glowMeshes[idx].material.opacity = 0.28 + (GLOBE_PHASES[idx].risk / 10) * 0.52;
    });
    return true;
  } catch { return false; }
}

function formatTickerMsg(ev) {
  switch (ev.type) {
    case 'inventory.updated': {
      const s = ev.payload.delta >= 0 ? '+' : '';
      return `📦 ${ev.payload.companyName}: ${s}${ev.payload.delta}d → ${ev.payload.currentDays}d`;
    }
    case 'risk.alert':
      return `⚠️ ${ev.payload.phaseName}: Risiko ${ev.payload.currentScore}/10 (${ev.payload.level})`;
    case 'disruption.detected':
      return `⚡ ${ev.payload.from}→${ev.payload.to} ${ev.payload.material} +${ev.payload.estimatedDelayDays}d`;
    case 'price.spike':
      return `💹 ${ev.payload.commodity}: ${ev.payload.changePct > 0 ? '+' : ''}${ev.payload.changePct}%`;
    default: return ev.type;
  }
}

function connectSSETicker() {
  const badge    = document.getElementById('api-badge');
  const badgeTxt = document.getElementById('api-badge-text');
  const ticker   = document.getElementById('event-ticker');
  const es = new EventSource(`${API_BASE}/events?types=inventory.updated,risk.alert,disruption.detected,price.spike`);
  es.onopen  = () => { badge.classList.add('live'); badgeTxt.textContent = 'API live'; };
  es.onerror = () => { badge.classList.remove('live'); badgeTxt.textContent = 'API offline'; };
  ['inventory.updated','risk.alert','disruption.detected','price.spike'].forEach(t => {
    es.addEventListener(t, e => {
      try {
        const ev  = JSON.parse(e.data);
        const sev = (ev.payload?.level === 'critical' || ev.payload?.severity === 'crit') ? 'crit'
                  : (ev.payload?.level === 'high' || ev.payload?.alert) ? 'warn' : 'ok';
        const item = document.createElement('div');
        item.className = `ticker-item ${sev}`;
        item.textContent = formatTickerMsg(ev);
        ticker.insertBefore(item, ticker.firstChild);
        while (ticker.children.length > 3) ticker.removeChild(ticker.lastChild);
      } catch {}
    });
  });
}

// ─── Animate Loop ─────────────────────────────────────────────────────────────

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Billboard: halos + pulses always face camera
  billboards.forEach(b => b.mesh.lookAt(camera.position));

  // Hover / selection scale on nodes
  nodeMeshes.forEach((n, i) => {
    const target = (i === hoveredIdx || i === selectedIdx) ? 1.45 : 1.0;
    const cur    = n.scale.x;
    const next   = cur + (target - cur) * 0.13;
    n.scale.setScalar(next);
    glowMeshes[i].scale.setScalar(next);
  });

  // Pulse ring animation
  if (ctrlPulseActive) {
    pulseStates.forEach((ps, i) => {
      ps.t = (ps.t + 0.005) % 1;
      const pm = pulseMeshes[i];
      pm.scale.setScalar(1 + ps.t * 3.8);
      pm.material.opacity = (1 - ps.t) * 0.44;
    });
  }

  // Arc particle movement
  arcParticles.forEach(p => {
    p.t = (p.t + p.speed) % 1;
    p.mesh.position.copy(p.curve.getPoint(p.t));
  });

  // Subtle globe self-rotation (independent of camera)
  globeMesh.rotation.y += 0.0005;

  renderer.render(scene, camera);
}

// ─── Resize ───────────────────────────────────────────────────────────────────

window.addEventListener('resize', () => {
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
});

// ─── Boot ─────────────────────────────────────────────────────────────────────

initFromAPI().then(live => {
  document.getElementById('globe-loading').style.display = 'none';
  animate();
  if (live) connectSSETicker();
});
</script>
