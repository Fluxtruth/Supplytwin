  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #0a0e1a;
      --bg2:   #0f1422;
      --bg3:   #131828;
      --border: rgba(255,255,255,0.07);
      --text:  #e8eaf0;
      --muted: #6470a0;
      --muted2:#8a93b2;
      --risk-critical: #dc2626;
      --risk-high:     #ea580c;
      --risk-medium:   #ca8a04;
      --risk-low:      #16a34a;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 0.6rem;
      padding: 1rem 2rem;
      background: rgba(10,14,26,0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .logo-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #4f8ef7, #a855f7);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .logo-text { font-size: 0.9rem; font-weight: 600; color: #c8cfe8; }
    .breadcrumb { display: flex; align-items: center; gap: 0.5rem; margin-left: 1.5rem; font-size: 0.8rem; color: var(--muted); }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--text); }
    .breadcrumb span { color: var(--muted2); }
    .nav-dt-btn {
      margin-left: auto; font-size: 0.78rem; color: #7eb3ff;
      text-decoration: none; padding: 0.35rem 0.8rem;
      border: 1px solid rgba(79,142,247,0.3); border-radius: 6px;
      transition: background .2s;
    }
    .nav-dt-btn:hover { background: rgba(79,142,247,0.1); }

    /* PHASE HERO */
    .phase-hero {
      border-bottom: 1px solid var(--border);
      padding: 3rem 2rem 2rem;
      max-width: 1100px; margin: 0 auto;
    }
    .phase-num-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem; border-radius: 5px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      background: rgba(255,255,255,0.06); color: var(--muted2);
      margin-bottom: 0.8rem;
    }
    .phase-title-row {
      display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .phase-icon { font-size: 2.4rem; flex-shrink: 0; }
    .phase-title-wrap h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800; line-height: 1.15; letter-spacing: -0.02em;
      color: var(--text);
    }
    .phase-title-wrap p { font-size: 0.9rem; color: var(--muted2); margin-top: 0.3rem; line-height: 1.6; }

    /* Risk gauge */
    .risk-gauge-wrap {
      display: flex; align-items: center; gap: 1.5rem;
      margin-top: 1.5rem; flex-wrap: wrap;
    }
    .risk-gauge {
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    }
    .gauge-track {
      width: 180px; height: 8px;
      background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden;
    }
    .gauge-fill { height: 100%; border-radius: 4px; }
    .gauge-labels {
      display: flex; justify-content: space-between; width: 180px;
      font-size: 0.65rem; color: var(--muted);
    }
    .risk-score-big {
      font-size: 3rem; font-weight: 900; line-height: 1;
    }
    .risk-score-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }

    .risk-factors {
      flex: 1; min-width: 280px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
    }
    .risk-factor {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.7rem;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.75rem;
    }
    .rf-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .rf-label { color: var(--muted2); }
    .rf-val { margin-left: auto; font-weight: 700; font-size: 0.8rem; }

    /* KPI CARDS */
    .section-title {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 0.8rem; margin-top: 2.5rem;
    }
    .kpi-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 0.8rem;
    }
    .kpi-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.1rem;
    }
    .kpi-card .kc-icon { font-size: 1.3rem; margin-bottom: 0.4rem; }
    .kpi-card .kc-val {
      font-size: 1.4rem; font-weight: 800; line-height: 1; margin-bottom: 0.2rem;
    }
    .kpi-card .kc-label { font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
    .kpi-card.ok   .kc-val { color: #4ade80; }
    .kpi-card.warn .kc-val { color: #fbbf24; }
    .kpi-card.crit .kc-val { color: #f87171; }

    /* COMPANY CARDS */
    .companies { display: flex; flex-direction: column; gap: 1.2rem; }
    .company-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden;
      transition: border-color .2s;
    }
    .company-card:hover { border-color: rgba(255,255,255,0.14); }

    .company-header {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.2rem 1.4rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .company-header::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; border-radius: 0;
      background: var(--phase-color, #4f8ef7);
    }
    .co-avatar {
      width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800; flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      color: var(--phase-color, #4f8ef7);
      letter-spacing: -0.03em;
    }
    .co-meta { flex: 1; min-width: 0; }
    .co-name { font-size: 1rem; font-weight: 700; color: var(--text); }
    .co-sub { font-size: 0.76rem; color: var(--muted); margin-top: 0.15rem; }
    .co-share {
      font-size: 1.5rem; font-weight: 900; color: var(--phase-color, #4f8ef7);
      flex-shrink: 0;
    }
    .co-dt-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.45rem 0.9rem; border-radius: 7px;
      font-size: 0.75rem; font-weight: 600;
      background: rgba(79,142,247,0.1);
      border: 1px solid rgba(79,142,247,0.25);
      color: #7eb3ff; text-decoration: none; flex-shrink: 0;
      transition: background .2s;
    }
    .co-dt-btn:hover { background: rgba(79,142,247,0.2); }
    .co-dt-btn .satellite-icon { font-size: 1rem; }

    .company-body {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.2rem;
      padding: 1.2rem 1.4rem;
    }
    .co-desc { font-size: 0.82rem; color: var(--muted2); line-height: 1.65; }
    .co-location { font-size: 0.73rem; color: var(--muted); margin-top: 0.4rem; }

    .co-kpis {
      display: flex; flex-direction: column; gap: 0.4rem;
      min-width: 200px; flex-shrink: 0;
    }
    .co-kpi-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.35rem 0.65rem; border-radius: 6px;
      font-size: 0.73rem;
      background: var(--bg3);
    }
    .co-kpi-label { color: var(--muted); }
    .co-kpi-val { font-weight: 700; }
    .co-kpi-val.ok   { color: #4ade80; }
    .co-kpi-val.warn { color: #fbbf24; }
    .co-kpi-val.crit { color: #f87171; }

    .co-alerts {
      padding: 0 1.4rem 1.2rem;
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .alert-chip {
      display: flex; align-items: flex-start; gap: 0.5rem;
      padding: 0.4rem 0.7rem; border-radius: 6px;
      font-size: 0.73rem; line-height: 1.5;
    }
    .alert-chip.warn { background: rgba(202,138,4,0.1); border: 1px solid rgba(202,138,4,0.2); color: #fbbf24; }
    .alert-chip.crit { background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.2); color: #f87171; }
    .alert-chip.info { background: rgba(79,142,247,0.08); border: 1px solid rgba(79,142,247,0.18); color: #7eb3ff; }

    .main-wrap { max-width: 1100px; margin: 0 auto; padding: 0 2rem 5rem; }

    .monopoly-tag {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      background: rgba(220,38,38,0.18); color: #f87171;
      border: 1px solid rgba(220,38,38,0.3); margin-left: 0.5rem;
      vertical-align: middle;
    }

    footer {
      text-align: center; padding: 2rem;
      font-size: 0.75rem; color: #2a304a;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 700px) {
      .company-body { grid-template-columns: 1fr; }
      .co-kpis { min-width: 0; }
      .risk-factors { grid-template-columns: 1fr; }
      .breadcrumb { display: none; }
    }
  </style>
</head>

/* ═══════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════ */
function colorForStatus(s) {
  return s === 'ok' ? '#4ade80' : s === 'warn' ? '#fbbf24' : '#f87171';
}

function renderDetail(phase) {
  const d = PHASES[phase];
  if (!d) {
    document.getElementById('phase-hero').innerHTML = '<p style="padding:3rem;color:#f87171">Phase nicht gefunden.</p>';
    return;
  }

  document.title = `${d.name} — Supply Chain Twin`;
  document.getElementById('nav-phase-name').textContent = d.name;
  document.documentElement.style.setProperty('--phase-color', d.color);

  /* ── Hero ── */
  const riskBarWidth = (d.risk.score / 10 * 100).toFixed(0);
  const riskBarColor = d.risk.cls === 'critical' ? '#dc2626' : d.risk.cls === 'high' ? '#ea580c' : d.risk.cls === 'medium' ? '#ca8a04' : '#16a34a';

  const rfHtml = d.riskFactors.map(rf => `
    <div class="risk-factor">
      <div class="rf-dot" style="background:${colorForStatus(rf.status)}"></div>
      <span class="rf-label">${rf.label}</span>
      <span class="rf-val" style="color:${colorForStatus(rf.status)}">${rf.val}</span>
    </div>`).join('');

  document.getElementById('phase-hero').innerHTML = `
    <div class="phase-num-badge">STUFE ${d.num} VON 10</div>
    <div class="phase-title-row">
      <span class="phase-icon">${d.icon}</span>
      <div class="phase-title-wrap">
        <h1>${d.name}</h1>
        <p>${d.subtitle}</p>
      </div>
    </div>
    <div class="risk-gauge-wrap">
      <div class="risk-gauge">
        <div style="font-size:0.7rem;color:var(--muted);margin-bottom:0.4rem;letter-spacing:0.05em;text-transform:uppercase">Risikoindikator</div>
        <div style="display:flex;align-items:baseline;gap:0.4rem">
          <span class="risk-score-big" style="color:${riskBarColor}">${d.risk.score}</span>
          <span style="font-size:1.2rem;color:var(--muted)">/10</span>
        </div>
        <div class="gauge-track" style="margin-top:0.5rem">
          <div class="gauge-fill" style="width:${riskBarWidth}%;background:${riskBarColor}"></div>
        </div>
        <div class="gauge-labels"><span>0</span><span>5</span><span>10</span></div>
        <div style="margin-top:0.4rem">
          <span class="risk-badge ${d.risk.cls}" style="display:inline-flex">${d.risk.label}</span>
        </div>
      </div>
      <div class="risk-factors">${rfHtml}</div>
    </div>`;

  /* ── Main ── */
  const kpiHtml = d.kpis.map(k => `
    <div class="kpi-card ${k.status}">
      <div class="kc-icon">${k.icon}</div>
      <div class="kc-val">${k.val}</div>
      <div class="kc-label">${k.label}</div>
    </div>`).join('');

  const companiesHtml = d.companies.map(co => {
    const kpiRows = co.kpis.map(k => `
      <div class="co-kpi-row">
        <span class="co-kpi-label">${k.label}</span>
        <span class="co-kpi-val ${k.status}">${k.val}</span>
      </div>`).join('');

    const alertsHtml = co.alerts.length ? `
      <div class="co-alerts">${co.alerts.map(a => `
        <div class="alert-chip ${a.level}">
          <span>${a.level === 'crit' ? '🚨' : a.level === 'warn' ? '⚠️' : 'ℹ️'}</span>
          <span>${a.text}</span>
        </div>`).join('')}
      </div>` : '';

    const dtUrl = `digital-twin.html?phase=${d.num}&company=${co.id}&name=${encodeURIComponent(co.name)}&lat=${co.location.split('·')[1]?.trim().split(' ')[0] || ''}&color=${encodeURIComponent(d.color)}`;

    return `
      <div class="company-card">
        <div class="company-header">
          <div class="co-avatar">${co.abbr}</div>
          <div class="co-meta">
            <div class="co-name">${co.name}${co.monopoly ? '<span class="monopoly-tag">Monopol</span>' : ''}</div>
            <div class="co-sub">${co.country} &nbsp;·&nbsp; Marktanteil: <strong style="color:${d.color}">${co.share}</strong></div>
          </div>
          <div class="co-share">${co.share}</div>
          <a href="${dtUrl}" class="co-dt-btn">
            <span class="satellite-icon">🛰️</span> Digital Twin
          </a>
        </div>
        <div class="company-body">
          <div>
            <div class="co-desc">${co.desc}</div>
            <div class="co-location">📍 ${co.location}</div>
          </div>
          <div class="co-kpis">${kpiRows}</div>
        </div>
        ${alertsHtml}
      </div>`;
  }).join('');

  document.getElementById('main-wrap').innerHTML = `
    <div class="section-title">Übersicht KPIs</div>
    <div class="kpi-cards">${kpiHtml}</div>

    <div class="section-title" style="margin-top:3rem">Beschreibung &amp; Kontext</div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.4rem 1.6rem;font-size:0.85rem;color:var(--muted2);line-height:1.75;border-left:4px solid ${d.color}">
      ${d.description}
    </div>

    <div class="section-title" style="margin-top:3rem">Wichtigste Anbieter &amp; Digital Twins</div>
    <div class="companies">${companiesHtml}</div>

    <div style="margin-top:2rem;text-align:center">
      <a href="supply-chain.html" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.4rem;border-radius:8px;font-size:0.85rem;font-weight:600;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted2);text-decoration:none;transition:background .2s"
        onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
        ← Zurück zur Supply Chain Map
      </a>
    </div>`;
}

/* ── Bootstrap ── */
const phase = new URLSearchParams(window.location.search).get('phase') || '01';
renderDetail(phase.padStart(2, '0'));

/* ── Shared CSS class ── */
const style = document.createElement('style');
style.textContent = `.risk-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;border-radius:999px;font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.risk-badge::before{content:'●';font-size:.45rem}.risk-badge.critical{background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.3)}.risk-badge.high{background:rgba(234,88,12,.15);color:#fb923c;border:1px solid rgba(234,88,12,.3)}.risk-badge.medium{background:rgba(202,138,4,.15);color:#fbbf24;border:1px solid rgba(202,138,4,.3)}.risk-badge.low{background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(22,163,74,.3)}`;
document.head.appendChild(style);
</script>
